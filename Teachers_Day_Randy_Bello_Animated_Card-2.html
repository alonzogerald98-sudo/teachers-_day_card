<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Teachers' Day - Randy Bello</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg,#dcefe8,#a9d3cf,#e8d9bd);
    color: #173a2e;
  }
  .scene {
    width: min(1000px, 94vw); height: min(720px, 92vh);
    position: relative; perspective: 1400px;
  }
  .hint {
    position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%);
    z-index: 10; font: 600 14px/1.2 Arial,sans-serif; letter-spacing: .08em;
    color: #fff; background: rgba(20,55,44,.75); padding: 10px 18px;
    border-radius: 999px; animation: pulse 1.8s infinite;
  }
  .cover {
    position:absolute; inset: 0; cursor:pointer; transform-style:preserve-3d;
    transition: transform 1s cubic-bezier(.2,.75,.25,1), opacity .8s;
    z-index: 5;
  }
  .cover.opened { transform: rotateY(-105deg) translateX(-4%); opacity:0; pointer-events:none; }
  .cover-front {
    width:100%; height:100%; border-radius:26px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background: linear-gradient(145deg,#174b3d,#2f725f 55%,#d8b86a);
    box-shadow: 0 30px 70px rgba(24,55,46,.35);
    border: 3px solid rgba(255,255,255,.65);
    backface-visibility:hidden;
  }
  .cover-front .flower { font-size:70px; margin-bottom:15px; animation: float 2.5s ease-in-out infinite; }
  .cover-front h1 { margin:0; color:#fff9df; font:700 clamp(40px,8vw,82px)/.95 Georgia,serif; text-align:center; }
  .cover-front h2 { color:#f7e6b0; margin:18px 0 0; font:italic 22px Georgia,serif; }
  .cover-front .click { margin-top:40px; color:#173a2e; background:#fff5d5; padding:13px 24px; border-radius:30px; font:700 15px Arial,sans-serif; }
  .inside {
    position:absolute; inset:0; border-radius:26px; overflow:auto;
    background:#f7f0df; box-shadow:0 30px 70px rgba(24,55,46,.3);
    padding:clamp(18px,3vw,35px); opacity:0; transform:scale(.96);
    transition:opacity 1s .5s, transform 1s .5s;
  }
  .inside.show { opacity:1; transform:scale(1); }
  .layout { display:grid; grid-template-columns: 38% 62%; gap:24px; min-height:100%; align-items:center; }
  .portrait-wrap { text-align:center; animation:rise 1.2s both; }
  .portrait {
    width:min(100%,340px); aspect-ratio:1/1; object-fit:cover; object-position:center top;
    border-radius:24px; border:7px solid #fff; box-shadow:0 18px 40px rgba(0,0,0,.2);
  }
  .teacher { margin-top:12px; font:bold 28px Georgia,serif; color:#173a2e; }
  .subtitle { margin-top:5px; font:italic 15px Arial,sans-serif; color:#6d725e; }
  .message-panel {
    background:rgba(255,255,255,.68); border-radius:22px; padding:26px 28px;
    border:1px solid #ded2b6; box-shadow:0 10px 30px rgba(76,65,45,.1);
  }
  .message-panel h3 { margin:0 0 12px; text-align:center; font:700 34px Georgia,serif; color:#173a2e; }
  .message-panel .line { height:2px; width:90px; background:#9b7b37; margin:0 auto 20px; }
  #typed {
    white-space:pre-wrap; font:18px/1.55 "Trebuchet MS",Arial,sans-serif; color:#30362f;
    min-height:330px;
  }
  .cursor { display:inline-block; width:2px; height:1em; background:#173a2e; vertical-align:-2px; animation:blink .7s infinite; }
  .replay {
    display:block; margin:18px auto 0; border:0; padding:11px 18px; border-radius:20px;
    background:#173a2e; color:#fff; font-weight:700; cursor:pointer;
  }
  .mini-card {
    margin-top:16px; text-align:center;
  }
  .mini-card img {
    width:min(220px,70%); border-radius:12px; box-shadow:0 10px 22px rgba(0,0,0,.16);
    opacity:0; transform:translateY(25px) rotate(-2deg);
  }
  .mini-card img.show { animation:photoIn 1.2s .3s forwards; }
  @keyframes rise { from {opacity:0;transform:translateY(45px) scale(.95)} to {opacity:1;transform:none} }
  @keyframes photoIn { to {opacity:1;transform:translateY(0) rotate(0)} }
  @keyframes float { 50% {transform:translateY(-10px) rotate(2deg)} }
  @keyframes pulse { 50% {transform:translateX(-50%) scale(1.05)} }
  @keyframes blink { 50% {opacity:0} }
  @media(max-width:760px) {
    body { overflow:auto; padding:15px 0; }
    .scene { height:auto; min-height:92vh; }
    .layout { grid-template-columns:1fr; }
    .portrait { width:220px; }
    .message-panel { padding:20px; }
    #typed { font-size:16px; min-height:0; }
    .inside { position:relative; }
    .cover { position:absolute; }
  }
</style>
</head>

<script>
const message = `Dear Sir Randy Bello,

Today, I just want to take a moment to say thank you.

Thank you for your patience, for believing in us even when we doubt ourselves, and for always pushing us to be better. Your efforts, sacrifices, and kindness do not go unnoticed. You may not always realize it, but you have made a big difference in our lives — not just in our studies, but also in how we see the world.

You teach with more than just lessons; you teach with your heart. And for that, we are truly grateful.

Wishing you a meaningful and well-deserved Teachers’ Day!

With respect and gratitude,
Gerald Villar`;
let i = 0, timer;

function openCard() {
  document.getElementById('cover').classList.add('opened');
  document.getElementById('inside').classList.add('show');
  document.getElementById('hint').style.display = 'none';
  document.getElementById('cardImage').classList.add('show');
  setTimeout(typeMessage, 1100);
}

function typeMessage() {
  clearInterval(timer);
  const el = document.getElementById('typed');
  const cursor = document.getElementById('cursor');
  el.textContent = '';
  i = 0;
  cursor.style.display = 'inline-block';
  timer = setInterval(() => {
    el.textContent += message[i++];
    if (i >= message.length) {
      clearInterval(timer);
      setTimeout(() => cursor.style.display='none', 1800);
    }
  }, 22);
}

function replay(e) {
  e.stopPropagation();
  typeMessage();
}
